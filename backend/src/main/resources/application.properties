server.port=8081
spring.application.name=MainBackend

server.servlet.context-path=/api

# Load backend/.env (KEY=value lines) automatically when it exists, so nobody has to
# set environment variables by hand. Real environment variables still win.
spring.config.import=optional:file:.env[.properties]

# ---- Database (PostgreSQL) ----
# Nothing here is a secret except the password, which has NO default on purpose:
# every developer sets their own DB_PASSWORD (see backend/.env.example and the README).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:MainDatabase}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---- JWT (moved in from the landing/auth project) ----
# Set a long random secret via env var before deploying: JWT_SECRET=...
app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-before-deploying-tirth-electrical-2026}
app.jwt.expiration-ms=86400000

# ---- First-admin seeding (see config/AdminSeeder.java) ----
# Only runs if no ADMIN exists yet AND this password is actually set.
# Set these as environment variables, not literal values here:
#   ADMIN_SEED_EMAIL=admin@yourcompany.com
#   ADMIN_SEED_PASSWORD=<a real password>
app.admin-seed.email=${ADMIN_SEED_EMAIL:admin@tirth-electrical.local}
app.admin-seed.password=${ADMIN_SEED_PASSWORD:}
app.admin-seed.full-name=${ADMIN_SEED_FULL_NAME:Administrator}

# ---- Role Upgrade Requests (Phase 2) ----
# The ID-proof image is sent as base64 inside a plain JSON body (not
# multipart), so it's not governed by spring.servlet.multipart.*. Raised
# defensively so a ~3MB image (~4MB once base64-encoded, plus JSON
# overhead) doesn't get rejected by embedded Tomcat's default body-size
# limit before it even reaches RoleUpgradeRequestServiceImpl's own
# 3MB-decoded check.
server.tomcat.max-http-form-post-size=8MB
server.tomcat.max-swallow-size=8MB

# ---- Email (Phase 3) - see EmailServiceImpl and .env.example ----
# All blank by default: if spring.mail.host is empty, EmailServiceImpl skips
# sending entirely (logs and returns) instead of attempting a doomed
# connection to a non-existent SMTP server. Nothing here is a real secret -
# these are all ${ENV_VAR:default} placeholders, same pattern as JWT_SECRET
# and ADMIN_SEED_PASSWORD above.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from-address=${MAIL_FROM:no-reply@tirth-electrical.local}
